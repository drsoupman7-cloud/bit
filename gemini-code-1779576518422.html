<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibben Archive - Glass Edition</title>
    <style>
        /* Animated Background for the Glass to blur over */
        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh; display: flex; flex-direction: column; gap: 20px; color: #fff;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* THE GLASSMORPHISM EFFECT */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        header {
            padding: 20px 30px; font-weight: bold; font-size: 26px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .version-badge {
            font-size: 14px; background: rgba(255,255,255,0.2); color: white; 
            padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3);
        }
        
        .main-container { display: flex; gap: 30px; flex: 1; flex-wrap: wrap; }
        
        .panel { padding: 30px; display: flex; flex-direction: column; flex: 1; min-width: 300px; }
        
        h2 { margin-top: 0; color: #fff; font-size: 22px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
        
        /* Glass Inputs */
        .upload-box {
            border: 2px dashed rgba(255,255,255,0.5); border-radius: 15px; padding: 30px; text-align: center;
            background: rgba(255, 255, 255, 0.05); cursor: pointer; transition: 0.3s; margin-bottom: 15px;
        }
        .upload-box:hover { background: rgba(255, 255, 255, 0.15); border-color: white; }
        input[type="file"] { display: none; }
        
        textarea {
            width: 100%; height: 120px; box-sizing: border-box; padding: 15px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff;
            font-family: monospace; resize: none; margin-bottom: 15px;
        }
        textarea::placeholder { color: rgba(255,255,255,0.5); }
        textarea:focus { outline: none; border-color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.3); }
        
        /* Glass Buttons */
        .action-row { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); 
            border-radius: 12px; cursor: pointer; transition: 0.3s; color: white;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);
        }
        button:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        /* The Virtual Screen */
        .preview-container {
            flex: 1; margin-top: 20px; border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3); min-height: 250px;
            background: #fff; /* Kept white so user apps render normally */
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header class="glass">
        <span>🗜️ Gibben Archive Utility</span>
        <span class="version-badge">V6.5 Glass Edition</span>
    </header>

    <div class="main-container">
        <div class="panel glass">
            <h2>1. Pack HTML to Code</h2>
            <p style="color: rgba(255,255,255,0.8); font-size: 14px;">Select an HTML file to compress it into a Gibben string.</p>
            
            <label class="upload-box">
                <strong style="font-size: 18px;">📁 Select .html File</strong>
                <input type="file" id="html-upload" accept=".html">
            </label>
            
            <p id="upload-status" style="color: #fff; font-weight: bold; margin-top: 0;"></p>
            <textarea id="packed-output" readonly placeholder="Your packed code will appear here..."></textarea>
            <button id="btn-copy">📋 Copy Code to Clipboard</button>
        </div>

        <div class="panel glass">
            <h2>2. Unpack Code to HTML</h2>
            <p style="color: rgba(255,255,255,0.8); font-size: 14px;">Paste a GIBBEN-RAW code here to view or restore it.</p>
            
            <textarea id="code-input" placeholder="Paste GIBBEN-RAW-... string here"></textarea>
            
            <div class="action-row">
                <button id="btn-preview">👁️ Preview App</button>
                <button id="btn-download">💾 Download .html</button>
            </div>
            
            <div class="preview-container">
                <iframe id="preview-frame"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('html-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Html = btoa(encodeURIComponent(event.target.result));
                document.getElementById('upload-status').innerText = `✅ Packed: ${file.name}`;
                document.getElementById('packed-output').value = "GIBBEN-RAW-" + base64Html;
            };
            reader.readAsText(file);
        });

        document.getElementById('btn-copy').addEventListener('click', () => {
            const outBox = document.getElementById('packed-output');
            if (outBox.value === '') return;
            outBox.select(); document.execCommand('copy');
            const btn = document.getElementById('btn-copy');
            const originalText = btn.innerText; btn.innerText = "✅ Copied!";
            setTimeout(() => btn.innerText = originalText, 2000);
        });

        function decodeGibbenCode(fullCode) {
            if (!fullCode || !fullCode.startsWith("GIBBEN-RAW-")) return alert("Invalid code!");
            try { return decodeURIComponent(atob(fullCode.replace("GIBBEN-RAW-", ""))); } 
            catch (err) { return alert("Corrupted code."); }
        }

        document.getElementById('btn-preview').addEventListener('click', () => {
            const decodedHTML = decodeGibbenCode(document.getElementById('code-input').value.trim());
            if (decodedHTML) document.getElementById('preview-frame').srcdoc = decodedHTML;
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            const decodedHTML = decodeGibbenCode(document.getElementById('code-input').value.trim());
            if (decodedHTML) {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([decodedHTML], { type: 'text/html' }));
                a.download = 'restored-gibben-app.html';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }
        });
    </script>
</body>
</html>
